[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gve"
version = "0.1.0"
description = "Governed Validation and Execution"
requires-python = ">=3.9"

[project.scripts]
gve = "gve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gve", "gve.*"]
